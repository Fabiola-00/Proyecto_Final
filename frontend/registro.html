<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitud de registro | SICOSE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <main class="contenedor acceso">
    <p class="marca">SICOSE</p><h1>Solicitud de registro como Instructor Voluntario</h1>
    <p class="subtitulo">La cuenta de Instructor Voluntario permanecerá pendiente hasta que administración revise la solicitud.</p>
    <form id="registro-form" data-token="{{ token or '' }}" enctype="multipart/form-data" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="reg-nombres">Nombres</label><input id="reg-nombres" name="nombres" maxlength="120" required>
      <label for="reg-apellido-paterno">Apellido paterno</label><input id="reg-apellido-paterno" name="apellido_paterno" maxlength="80" required>
      <label for="reg-apellido-materno">Apellido materno</label><input id="reg-apellido-materno" name="apellido_materno" maxlength="80" required>
      <label for="reg-fecha-nacimiento">Fecha de nacimiento completa</label><input id="reg-fecha-nacimiento" name="fecha_nacimiento" type="date" required>
      <label>Código del Instructor<output class="codigo-generado" data-codigo-instructor>Completa nombres y fecha de nacimiento</output></label>
      <label for="reg-especialidad">Especialidad principal</label><select id="reg-especialidad" name="especialidad_principal" required><option value="">Selecciona una especialidad</option><option>Rescate en agua</option><option>Rescate en montaña</option><option>Rescate en selva</option><option>Lucha contra incendios</option><option>Primeros Auxilios</option><option>K-9</option></select>
      <label for="reg-username">Nombre de usuario</label><input id="reg-username" name="username" maxlength="80" autocomplete="username" required>
      <label for="reg-correo">Correo electrónico</label><input id="reg-correo" name="correo" type="email" maxlength="254">
      <label for="reg-foto">Foto de perfil (PNG/JPEG, máximo 3 MiB)</label><input id="reg-foto" name="foto" type="file" accept="image/png,image/jpeg">
      <label for="reg-password">Contraseña (mínimo 12 caracteres)</label><input id="reg-password" name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>
      <button id="registro-button" type="submit">Enviar solicitud</button>
      <p id="auth-message" class="mensaje" role="status" aria-live="polite"></p>
    </form>
    <p><a href="/login">Volver al inicio de sesión</a></p>
  </main>
</body>
</html>
