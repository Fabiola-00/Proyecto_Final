{% extends "_dashboard_base.html" %}
{% block contenido %}
<section class="seccion-panel">
  <div class="titulo-seccion"><div><p class="sobrelinea">CONTROL DIARIO</p><h2>Registrar asistencia</h2></div></div>
  <form id="asistencias-form" class="tarjeta-amplia">
    <div class="formulario-inline asistencia-cabecera">
      <label>Fecha de la gestión<input name="fecha" type="date" required></label>
      <label>Actividad o gestión<input name="actividad" maxlength="160" placeholder="Ej.: Entrenamiento semanal" required></label>
    </div>
    <div id="asistencias-voluntarios" class="lista-asistencia" aria-live="polite"><p class="nota-informativa">Selecciona una fecha para cargar el equipo activo.</p></div>
    <div class="acciones-formulario"><button id="guardar-asistencias" type="submit" disabled>Guardar asistencia</button><span id="asistencias-conteo" class="texto-secundario"></span></div>
  </form>
  <p id="asistencias-mensaje" class="mensaje" role="status" aria-live="polite"></p>
</section>
<section class="seccion-panel">
  <div class="titulo-seccion"><div><p class="sobrelinea">CONSULTA</p><h2>Historial de asistencias</h2></div></div>
  <form id="asistencias-filtros" class="tarjeta-amplia formulario-inline">
    <label>Instructor Voluntario<select name="voluntario_id"><option value="">Todos los de mi ámbito</option></select></label>
    <label>Vista<select name="modo"><option value="ultima">Última gestión registrada</option><option value="rango">Rango de fechas</option></select></label>
    <label class="filtro-fecha">Desde<input name="desde" type="date" disabled></label>
    <label class="filtro-fecha">Hasta<input name="hasta" type="date" disabled></label>
    <button type="submit">Consultar historial</button>
  </form>
  <p id="asistencias-historial-resumen" class="nota-informativa" aria-live="polite"></p>
  <div class="tabla-contenedor"><table class="tabla-registros tabla-asistencia"><thead><tr><th>Fecha</th><th>Instructor Voluntario</th><th>Actividad</th><th>Estado</th></tr></thead><tbody id="asistencias-historial"></tbody></table></div>
</section>
{% endblock %}
