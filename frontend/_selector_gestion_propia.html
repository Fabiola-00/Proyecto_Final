<form class="formulario-inline" method="get" id="gestion-propia-form">
  <label>Gestión<select name="periodo_id" id="gestion-propia-selector" onchange="this.form.requestSubmit()">
    {% for p in gestiones %}<option value="{{ p.id }}"{% if gestion and p.id == gestion.id %} selected{% endif %}>{{ p.nombre }} · {{ p.estado|capitalize }}</option>{% else %}<option value="">Sin gestiones disponibles</option>{% endfor %}
  </select></label><button{% if not gestiones %} disabled{% endif %}>Consultar</button>
</form>
{% if gestion %}<p class="ayuda-campo">{{ gestion.fecha_inicio }} — {{ gestion.fecha_fin }}</p>{% else %}<p class="nota-informativa">Aún no hay una Gestión iniciada disponible.</p>{% endif %}
