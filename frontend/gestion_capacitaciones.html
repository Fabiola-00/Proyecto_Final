{% extends "_dashboard_base.html" %}
{% block contenido %}
<section class="seccion-panel">
  <div class="titulo-seccion"><div><p class="sobrelinea">HISTORIAL FORMATIVO</p><h2>Registrar o editar curso</h2></div></div>
  <form id="capacitacion-form" class="tarjeta-amplia formulario-inline">
    <input name="id" type="hidden">
    <label>Instructor Voluntario<select name="voluntario_id" required></select></label>
    <label>Curso o capacitación<input name="nombre" maxlength="160" required></label>
    <label>Entidad<input name="entidad" maxlength="160"></label>
    <label>Fecha<input name="fecha" type="date"></label>
    <label class="campo-ancho">Observación<textarea name="observacion" maxlength="2000"></textarea></label>
    <div class="acciones-formulario"><button id="capacitacion-guardar" type="submit">Guardar capacitación</button><button id="capacitacion-cancelar" class="boton-secundario" type="button" hidden>Cancelar edición</button></div>
  </form>
  <p id="capacitacion-mensaje" class="mensaje" role="status" aria-live="polite"></p>
</section>
<section class="seccion-panel">
  <div class="titulo-seccion titulo-accion"><div><p class="sobrelinea">REGISTROS</p><h2>Capacitaciones y cursos</h2></div><label class="filtro-tabla">Filtrar por Instructor Voluntario<select id="capacitacion-filtro"><option value="">Todos los de mi ámbito</option></select></label></div>
  <div class="tabla-contenedor"><table class="tabla-registros tabla-capacitaciones"><thead><tr><th>Fecha</th><th>Instructor Voluntario</th><th>Curso</th><th>Entidad</th><th>Observación</th><th>Acciones</th></tr></thead><tbody id="capacitaciones-lista"></tbody></table></div>
  <p id="capacitaciones-vacio" class="nota-informativa" hidden>No hay cursos registrados para este filtro.</p>
</section>
{% endblock %}
