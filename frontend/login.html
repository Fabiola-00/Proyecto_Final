<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso a SICOSE">
  <title>Ingresar | SICOSE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <main class="contenedor acceso">
    <p class="marca">SICOSE</p>
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Sistema de Control y Evaluación de Personal</p>
    <form id="login-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Nombre de usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="80" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="login-button" type="submit">Ingresar</button>
      <p id="auth-message" class="mensaje" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
